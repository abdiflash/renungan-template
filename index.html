<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renungan Harian</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">

  <style>
    .app-header {
      background-color: #1b3058 !important;
    }

    .calendar-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 450px;
      margin: 0 auto;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .cal-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: #1b3058;
      font-weight: 700;
    }

    .btn-cal-nav {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #1b3058;
      background: transparent;
      color: #1b3058;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .btn-cal-nav:hover {
      background-color: #1b3058;
      color: #ffffff;
    }

    .cal-grid-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #888888;
      margin-bottom: 12px;
    }

    .cal-grid-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .cal-day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #b0b0b0;
      background-color: #f2f2f2;
      cursor: default;
      user-select: none;
      box-sizing: border-box;
    }

    .cal-day-cell.available {
      background-color: #dbeafe;
      color: #1b3058;
      cursor: pointer;
    }

    .cal-day-cell.available:hover {
      background-color: #bfdbfe;
    }

    .cal-day-cell.selected {
      border: 2.5px solid #1b3058;
      font-weight: 800;
    }

    .cal-day-cell.empty {
      background: transparent;
    }

    .cal-footer {
      text-align: center;
      margin-top: 25px;
    }

    .btn-close-cal {
      background: #ffffff;
      border: 2px solid #1b3058;
      color: #1b3058;
      border-radius: 25px;
      padding: 10px 32px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-close-cal:hover {
      background: #1b3058;
      color: #ffffff;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h1>Renungan Harian</h1>
  <p>Tahun Ajaran: <strong id="academicYear">2025/2026</strong></p>
</header>

<main class="container">

  <!-- Indikator Loading Mini (Top Banner) -->
  <div id="loader" class="loading hidden" style="padding: 10px; font-size: 14px;">
    ⏳ Memuat data terbaru...
  </div>

  <!-- Tampilan Kalender (Langsung Muncul di Awal) -->
  <section id="calendarSection">
    <div class="calendar-card">
      <div class="cal-header">
        <button class="btn-cal-nav" onclick="changeCalMonth(-1)">◀</button>
        <h2 id="calMonthYearTitle">September 2026</h2>
        <button class="btn-cal-nav" onclick="changeCalMonth(1)">▶</button>
      </div>

      <div class="cal-grid-header">
        <div>MIN</div>
        <div>SEN</div>
        <div>SEL</div>
        <div>RAB</div>
        <div>KAM</div>
        <div>JUM</div>
        <div>SAB</div>
      </div>

      <div id="calGridDays" class="cal-grid-days"></div>

      <div class="cal-footer">
        <button class="btn-close-cal" onclick="closeCalendar()">Tutup Kalender</button>
      </div>
    </div>
  </section>

  <!-- Konten Renungan Utama -->
  <section id="renungan" class="hidden">

    <header>
      <div class="date-navigation">
        <button class="btn-nav-day" onclick="navigateDay(-1)" title="Hari Sebelumnya">◀</button>
        <time class="displayDateText" onclick="openCalendar()" style="cursor: pointer;" title="Klik untuk pilih tanggal"></time>
        <button class="btn-nav-day" onclick="navigateDay(1)" title="Hari Berikutnya">▶</button>
        <button class="btn-nav-day" onclick="openCalendar()" title="Buka Kalender">📅</button>
      </div>

      <div class="audio-container">
        <div class="action-area-top">
          <div class="font-controls">
            <button class="btn-font" onclick="changeFontSize(-1)" title="Kecilkan Teks">A-</button>
            <button class="btn-font" onclick="changeFontSize(1)" title="Besarkan Teks">A+</button>
          </div>

          <button id="audioControl" class="btn-elegant" onclick="toggleAudio()" style="display:none;">▶️ Putar Audio</button>
        </div>

        <audio id="audioPlayer" controls class="audio-slider" style="display:none;">
          <source id="audioSource" src="" type="audio/mpeg">
        </audio>
      </div>
    </header>

    <article id="articleContent">
      <h3 id="displayJudul"></h3>

      <div class="ayat-box">
        <span id="displayAyat" class="ayat-ref"></span>
        <blockquote id="displayAyatText" class="ayat-text"></blockquote>
      </div>

      <div id="displayIsi"></div>

      <div class="refleksi-box">
        <div class="refleksi-label">Refleksi</div>
        <p id="displayRefleksi" class="refleksi-content"></p>
      </div>
    </article>

    <div class="article-footer-actions">
      <button class="btn-share-wa" onclick="shareToWhatsApp()">
        📲 Bagikan ke WhatsApp
      </button>
      
      <div class="reader-stats">
        📖 Hari ini sudah dibaca oleh <span id="count">0</span> orang
      </div>
    </div>

  </section>

  <!-- Tampilan Jika Data Kosong -->
  <section id="emptyState" class="hidden">
    <div class="date-navigation" style="justify-content: center; margin-bottom: 15px;">
      <button class="btn-nav-day" onclick="navigateDay(-1)" title="Hari Sebelumnya">◀</button>
      <time class="displayDateText" onclick="openCalendar()" style="cursor: pointer; font-weight: bold; margin: 0 10px;" title="Klik untuk pilih tanggal"></time>
      <button class="btn-nav-day" onclick="navigateDay(1)" title="Hari Berikutnya">▶</button>
      <button class="btn-nav-day" onclick="openCalendar()" title="Buka Kalender">📅</button>
    </div>

    <div style="text-align: center; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
      <h3 style="margin-top:0; color:#333;">Belum ada renungan untuk tanggal ini.</h3>
      <p style="color: #666; font-size: 14px; margin-bottom: 0;">Gunakan tombol panah ◀ / ▶ atau buka kalender untuk memilih tanggal.</p>
    </div>
  </section>

</main>

<footer class="app-footer">
  <p>&copy; 2026 <strong id="footerSchoolName">Sekolah</strong></p>
  <p><a href="#" id="footerSchoolLink" class="footer-link" target="_blank"></a></p>
</footer>

<script src="config.js"></script>
<script>
  let currentFontSize = 100;
  let currentActiveDateStr = "";
  let availableDatesList = JSON.parse(localStorage.getItem('renungan_dates') || '[]');
  let calViewYear = 2026;
  let calViewMonth = 8;
  
  // Guard untuk mencegah bentrokan request saat diklik cepat
  let currentRequestId = 0;

  document.addEventListener('DOMContentLoaded', function() {
    if (typeof CONFIG !== 'undefined') {
      const schName = document.getElementById('footerSchoolName');
      const schLink = document.getElementById('footerSchoolLink');
      if (schName && CONFIG.SCHOOL_NAME) schName.innerText = CONFIG.SCHOOL_NAME;
      if (schLink && CONFIG.SCHOOL_SITE) {
        schLink.innerText = CONFIG.SCHOOL_SITE;
        schLink.href = CONFIG.SCHOOL_URL || '#';
      }
    }

    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;
    
    calViewYear = today.getFullYear();
    calViewMonth = today.getMonth();

    renderCalendar();
    loadData(todayStr, true);
  });

  // Mencegah pergeseran hari akibat perbedaan zona waktu UTC/WIB
  function parseDate(dateStr) {
    if (!dateStr) return new Date();
    let clean = String(dateStr).split('T')[0].split(' ')[0].trim();
    let parts = clean.split('-');
    if (parts.length === 3 && parts[0].length === 4) {
      return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10), 12, 0, 0);
    }
    return new Date();
  }

  function formatDateToString(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function renderDataToUI(data) {
    document.getElementById('displayJudul').innerText = data.judul || '';
    document.getElementById('displayAyat').innerText = data.ayatRef || '';
    document.getElementById('displayAyatText').innerText = data.ayatText || '';
    document.getElementById('displayIsi').innerHTML = data.isi || '';
    document.getElementById('displayRefleksi').innerText = data.refleksi || '';
    document.getElementById('count').innerText = data.views || 0;

    if (data.academicYear) {
      document.getElementById('academicYear').innerText = data.academicYear;
    }

    // Audio
    const audioPlayer = document.getElementById('audioPlayer');
    const audioSource = document.getElementById('audioSource');
    const audioControl = document.getElementById('audioControl');

    if (audioControl) audioControl.innerText = "▶️ Putar Audio";
    if (data.audio && data.audio.trim() !== '') {
      if (audioSource) audioSource.src = data.audio;
      if (audioPlayer) {
        audioPlayer.load();
        audioPlayer.style.display = 'block';
      }
      if (audioControl) audioControl.style.display = 'inline-block';
    } else {
      if (audioPlayer) audioPlayer.style.display = 'none';
      if (audioControl) audioControl.style.display = 'none';
    }
  }

  function loadData(dateStr, isInitialLoad = false) {
    // Kunci langsung tanggal aktif & perbarui UI teks tanggal seketika
    currentActiveDateStr = dateStr;
    updateDateText(dateStr);

    // ID unik setiap request
    const requestId = ++currentRequestId;

    const loader = document.getElementById('loader');
    const renunganSec = document.getElementById('renungan');
    const emptySec = document.getElementById('emptyState');
    const calSec = document.getElementById('calendarSection');

    // 1. Cek LocalStorage Cache (Respon Instan)
    const cachedData = localStorage.getItem(`renungan_${dateStr}`);
    if (cachedData && !isInitialLoad) {
      try {
        const parsed = JSON.parse(cachedData);
        if (parsed && parsed.status === 'success' && parsed.data) {
          if (calSec) calSec.classList.add('hidden');
          if (emptySec) emptySec.classList.add('hidden');
          if (renunganSec) renunganSec.classList.remove('hidden');
          renderDataToUI(parsed.data);
        }
      } catch (e) {
        console.error("Cache error", e);
      }
    } else if (!isInitialLoad) {
      if (loader) loader.classList.remove('hidden');
    }

    if (typeof CONFIG === 'undefined' || !CONFIG.API_URL) return;

    // 2. Fetch Data Server
    fetch(`${CONFIG.API_URL}?date=${dateStr}`)
      .then(res => res.json())
      .then(resData => {
        // Abaikan jika user sudah mengeklik tanggal lain yang lebih baru
        if (requestId !== currentRequestId) return;

        if (loader) loader.classList.add('hidden');

        if (resData.availableDates) {
          availableDatesList = resData.availableDates;
          localStorage.setItem('renungan_dates', JSON.stringify(availableDatesList));
          renderCalendar();
        }

        if (resData.status === 'success' && resData.data) {
          localStorage.setItem(`renungan_${dateStr}`, JSON.stringify(resData));

          renderDataToUI(resData.data);

          if (!isInitialLoad) {
            if (calSec) calSec.classList.add('hidden');
            if (emptySec) emptySec.classList.add('hidden');
            if (renunganSec) renunganSec.classList.remove('hidden');
          }

        } else {
          if (!isInitialLoad) {
            if (calSec) calSec.classList.add('hidden');
            if (renunganSec) renunganSec.classList.add('hidden');
            if (emptySec) emptySec.classList.remove('hidden');
          }
        }
      })
      .catch(err => {
        if (requestId !== currentRequestId) return;
        console.error("Gagal mengambil data:", err);
        if (loader) loader.classList.add('hidden');
      });
  }

  function updateDateText(dateStr) {
    const dateObj = parseDate(dateStr);
    const elems = document.querySelectorAll('.displayDateText');

    if (!dateObj) {
      elems.forEach(el => { el.innerText = dateStr || ''; });
      return;
    }

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const formatted = dateObj.toLocaleDateString('id-ID', options);

    elems.forEach(el => {
      el.innerText = formatted;
    });
  }

  function navigateDay(offset) {
    let baseDate = parseDate(currentActiveDateStr);
    baseDate.setDate(baseDate.getDate() + offset);

    const targetDateStr = formatDateToString(baseDate);
    loadData(targetDateStr, false);
  }

  /* --- LOGIKA KALENDER --- */
  function openCalendar() {
    const renunganSec = document.getElementById('renungan');
    const emptySec = document.getElementById('emptyState');
    const calSec = document.getElementById('calendarSection');

    if (renunganSec) renunganSec.classList.add('hidden');
    if (emptySec) emptySec.classList.add('hidden');
    if (calSec) calSec.classList.remove('hidden');

    const activeObj = parseDate(currentActiveDateStr);
    calViewYear = activeObj.getFullYear();
    calViewMonth = activeObj.getMonth();

    renderCalendar();
  }

  function closeCalendar() {
    const calSec = document.getElementById('calendarSection');
    const renunganSec = document.getElementById('renungan');
    const emptySec = document.getElementById('emptyState');

    if (calSec) calSec.classList.add('hidden');

    const displayJudul = document.getElementById('displayJudul')?.innerText;
    if (displayJudul && displayJudul.trim() !== '') {
      if (renunganSec) renunganSec.classList.remove('hidden');
    } else {
      if (emptySec) emptySec.classList.remove('hidden');
    }
  }

  function changeCalMonth(offset) {
    calViewMonth += offset;
    if (calViewMonth < 0) {
      calViewMonth = 11;
      calViewYear -= 1;
    } else if (calViewMonth > 11) {
      calViewMonth = 0;
      calViewYear += 1;
    }
    renderCalendar();
  }

  function renderCalendar() {
    const monthNames = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    document.getElementById('calMonthYearTitle').innerText = `${monthNames[calViewMonth]} ${calViewYear}`;

    const grid = document.getElementById('calGridDays');
    grid.innerHTML = '';

    const firstDayIndex = new Date(calViewYear, calViewMonth, 1).getDay();
    const totalDays = new Date(calViewYear, calViewMonth + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'cal-day-cell empty';
      grid.appendChild(emptyDiv);
    }

    for (let d = 1; d <= totalDays; d++) {
      const mmStr = String(calViewMonth + 1).padStart(2, '0');
      const ddStr = String(d).padStart(2, '0');
      const dateKey = `${calViewYear}-${mmStr}-${ddStr}`;

      const cell = document.createElement('div');
      cell.className = 'cal-day-cell';
      cell.innerText = d;

      const isAvailable = availableDatesList.includes(dateKey);
      if (isAvailable) {
        cell.classList.add('available');
      }

      if (dateKey === currentActiveDateStr) {
        cell.classList.add('selected');
      }

      cell.onclick = function() {
        loadData(dateKey, false);
      };

      grid.appendChild(cell);
    }
  }

  function changeFontSize(step) {
    currentFontSize += step * 10;
    if (currentFontSize < 80) currentFontSize = 80;
    if (currentFontSize > 160) currentFontSize = 160;
    
    const target = document.getElementById('articleContent');
    if (target) {
      target.style.fontSize = currentFontSize + '%';
    }
  }

  function toggleAudio() {
    const player = document.getElementById('audioPlayer');
    const btn = document.getElementById('audioControl');
    if (!player) return;

    if (player.paused) {
      player.play();
      if (btn) btn.innerText = "⏸️ Jeda Audio";
    } else {
      player.pause();
      if (btn) btn.innerText = "▶️ Putar Audio";
    }
  }

  function shareToWhatsApp() {
    const judul = document.getElementById('displayJudul')?.innerText || '';
    const ayat = document.getElementById('displayAyat')?.innerText || '';
    const url = window.location.href;
    const text = `*${judul}*\n_${ayat}_\n\nMari baca renungan hari ini melalui tautan berikut:\n${url}`;
    
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
  }
</script>

</body>
</html>
