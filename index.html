<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Renungan Harian</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">
  <h1>Renungan Harian</h1>
  <p>Tahun Ajaran: <strong id="academicYear">2025/2026</strong></p>
</header>

<main class="container">

  <!-- Indikator Loading -->
  <div id="loader" class="loading">
    ⏳ Memuat data...
  </div>

  <!-- Konten Renungan Utama -->
  <section id="renungan" class="hidden">

    <header>
      <div class="date-navigation">
        <button class="btn-nav-day" onclick="navigateDay(-1)" title="Hari Sebelumnya">◀</button>
        <time id="displayDate"></time>
        <button class="btn-nav-day" onclick="navigateDay(1)" title="Hari Berikutnya">▶</button>
      </div>

      <div class="audio-container">
        <div class="action-area-top">
          <div class="font-controls">
            <button class="btn-font" onclick="changeFontSize(-1)" title="Kecilkan Teks">A-</button>
            <button class="btn-font" onclick="changeFontSize(1)" title="Besarkan Teks">A+</button>
          </div>

          <button id="audioControl" class="btn-elegant" onclick="toggleAudio()" style="display:none;">▶️ Putar Audio</button>
        </div>

        <audio id="audioPlayer" controls class="audio-slider" style="display:none;">
          <source id="audioSource" src="" type="audio/mpeg">
        </audio>
      </div>
    </header>

    <article id="articleContent">
      <h3 id="displayJudul"></h3>

      <div class="ayat-box">
        <span id="displayAyat" class="ayat-ref"></span>
        <blockquote id="displayAyatText" class="ayat-text"></blockquote>
      </div>

      <div id="displayIsi"></div>

      <div class="refleksi-box">
        <div class="refleksi-label">Refleksi</div>
        <p id="displayRefleksi" class="refleksi-content"></p>
      </div>
    </article>

    <div class="article-footer-actions">
      <button class="btn-share-wa" onclick="shareToWhatsApp()">
        📲 Bagikan ke WhatsApp
      </button>
      
      <div class="reader-stats">
        📖 Hari ini sudah dibaca oleh <span id="count">0</span> orang
      </div>
    </div>

  </section>

  <!-- Tampilan Jika Data Kosong -->
  <section id="emptyState" class="hidden">
    <h3>Belum ada renungan untuk tanggal ini.</h3>
  </section>

</main>

<footer class="app-footer">
  <p>&copy; 2026 <strong id="footerSchoolName">Sekolah</strong></p>
  <p><a href="#" id="footerSchoolLink" class="footer-link" target="_blank"></a></p>
</footer>

<script src="config.js"></script>
<script>
  let currentFontSize = 100;

  // Jalankan saat halaman selesai dimuat
  document.addEventListener('DOMContentLoaded', function() {
    // Set identitas sekolah dari config
    if (typeof CONFIG !== 'undefined') {
      const schName = document.getElementById('footerSchoolName');
      const schLink = document.getElementById('footerSchoolLink');
      if (schName && CONFIG.SCHOOL_NAME) schName.innerText = CONFIG.SCHOOL_NAME;
      if (schLink && CONFIG.SCHOOL_SITE) {
        schLink.innerText = CONFIG.SCHOOL_SITE;
        schLink.href = CONFIG.SCHOOL_URL || '#';
      }
    }

    // Ambil tanggal hari ini (YYYY-MM-DD)
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    
    // Muat data renungan awal
    loadData(`${yyyy}-${mm}-${dd}`);
  });

  // Fungsi utama pemuat data dari Apps Script
  function loadData(dateStr) {
    const loader = document.getElementById('loader');
    const renunganSec = document.getElementById('renungan');
    const emptySec = document.getElementById('emptyState');

    if (loader) loader.classList.remove('hidden');
    if (renunganSec) renunganSec.classList.add('hidden');
    if (emptySec) emptySec.classList.add('hidden');

    if (typeof CONFIG === 'undefined' || !CONFIG.API_URL) {
      console.error("API_URL belum diatur di config.js");
      if (loader) loader.classList.add('hidden');
      return;
    }

    fetch(`${CONFIG.API_URL}?date=${dateStr}`)
      .then(res => res.json())
      .then(resData => {
        if (loader) loader.classList.add('hidden');

        if (resData.status === 'success' && resData.data) {
          if (renunganSec) renunganSec.classList.remove('hidden');

          document.getElementById('displayJudul').innerText = resData.data.judul || '';
          document.getElementById('displayAyat').innerText = resData.data.ayatRef || '';
          document.getElementById('displayAyatText').innerText = resData.data.ayatText || '';
          document.getElementById('displayIsi').innerHTML = resData.data.isi || '';
          document.getElementById('displayRefleksi').innerText = resData.data.refleksi || '';
          document.getElementById('count').innerText = resData.data.views || 0;

          if (resData.data.academicYear) {
            document.getElementById('academicYear').innerText = resData.data.academicYear;
          }

          // Format Tampilan Tanggal Navigasi
          const dateObj = new Date(dateStr + 'T00:00:00');
          const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
          const displayElem = document.getElementById('displayDate');
          if (displayElem) {
            displayElem.innerText = dateObj.toLocaleDateString('id-ID', options);
            displayElem.dataset.isoDate = dateStr;
          }

          // Pemutar Audio
          const audioPlayer = document.getElementById('audioPlayer');
          const audioSource = document.getElementById('audioSource');
          const audioControl = document.getElementById('audioControl');
          
          if (resData.data.audio && resData.data.audio.trim() !== '') {
            if (audioSource) audioSource.src = resData.data.audio;
            if (audioPlayer) {
              audioPlayer.load();
              audioPlayer.style.display = 'block';
            }
            if (audioControl) audioControl.style.display = 'inline-block';
          } else {
            if (audioPlayer) audioPlayer.style.display = 'none';
            if (audioControl) audioControl.style.display = 'none';
          }

        } else {
          if (emptySec) emptySec.classList.remove('hidden');
        }
      })
      .catch(err => {
        console.error("Gagal mengambil data:", err);
        if (loader) loader.classList.add('hidden');
        if (emptySec) emptySec.classList.remove('hidden');
      });
  }

  // Navigasi Tanggal (Hari Sebelum / Sesudah)
  function navigateDay(offset) {
    const displayElem = document.getElementById('displayDate');
    let baseDate = new Date();

    if (displayElem && displayElem.dataset.isoDate) {
      baseDate = new Date(displayElem.dataset.isoDate + 'T00:00:00');
    }

    baseDate.setDate(baseDate.getDate() + offset);

    const yyyy = baseDate.getFullYear();
    const mm = String(baseDate.getMonth() + 1).padStart(2, '0');
    const dd = String(baseDate.getDate()).padStart(2, '0');

    loadData(`${yyyy}-${mm}-${dd}`);
  }

  // Zoom Ukuran Teks Artikel
  function changeFontSize(step) {
    currentFontSize += step * 10;
    if (currentFontSize < 80) currentFontSize = 80;
    if (currentFontSize > 160) currentFontSize = 160;
    
    const target = document.getElementById('articleContent');
    if (target) {
      target.style.fontSize = currentFontSize + '%';
    }
  }

  // Putar / Jeda Audio
  function toggleAudio() {
    const player = document.getElementById('audioPlayer');
    const btn = document.getElementById('audioControl');
    if (!player) return;

    if (player.paused) {
      player.play();
      if (btn) btn.innerText = "⏸️ Jeda Audio";
    } else {
      player.pause();
      if (btn) btn.innerText = "▶️ Putar Audio";
    }
  }

  // Bagikan ke WhatsApp
  function shareToWhatsApp() {
    const judul = document.getElementById('displayJudul')?.innerText || '';
    const ayat = document.getElementById('displayAyat')?.innerText || '';
    const url = window.location.href;
    const text = `*${judul}*\n_${ayat}_\n\nMari baca renungan hari ini melalui tautan berikut:\n${url}`;
    
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
  }
</script>

</body>
</html>
