<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Renungan Harian</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">
  <h1>Renungan Harian</h1>
  <p>Tahun Ajaran: <strong id="academicYear">Memuat...</strong></p>
</header>

<main class="container">

  <div id="loader" class="loading">
    ⏳ Memuat data...
  </div>

  <section id="renungan" class="hidden">

    <header>
      <div class="date-navigation">
        <button class="btn-nav-day" onclick="navigateDay(-1)" title="Hari Sebelumnya">◀</button>
        <time id="displayDate"></time>
        <button class="btn-nav-day" onclick="navigateDay(1)" title="Hari Berikutnya">▶</button>
      </div>

      <div class="audio-container">
        <div class="action-area-top">
          <div class="font-controls">
            <button class="btn-font" onclick="changeFontSize(-1)" title="Kecilkan Teks">A-</button>
            <button class="btn-font" onclick="changeFontSize(1)" title="Besarkan Teks">A+</button>
          </div>

          <button class="btn-elegant" onclick="showCalendarView()">📅 Buka Kalender</button>
          <button id="audioControl" class="btn-elegant" onclick="toggleAudio()">▶️ Putar Audio</button>
        </div>

        <audio id="audioPlayer" controls class="audio-slider">
          <source id="audioSource" src="" type="audio/mpeg">
        </audio>
      </div>
    </header>

    <article id="articleContent">
      <h3 id="displayJudul"></h3>

      <div class="ayat-box">
        <span id="displayAyat" class="ayat-ref"></span>
        <blockquote id="displayAyatText" class="ayat-text"></blockquote>
      </div>

      <div id="displayIsi"></div>

      <div class="refleksi-box">
        <div class="refleksi-label">Refleksi</div>
        <p id="displayRefleksi" class="refleksi-content"></p>
      </div>
    </article>

    <div class="article-footer-actions">
      <button class="btn-share-wa" onclick="shareToWhatsApp()">
        📲 Bagikan ke WhatsApp
      </button>
      
      <div class="reader-stats">
        📖 Hari ini sudah dibaca oleh <span id="count">0</span> orang
      </div>
    </div>

  </section>

  <section id="emptyState" class="hidden">
    <h3>Belum ada renungan hari ini.</h3>
    <button class="btn-elegant" onclick="showCalendarView()">📅 Buka Kalender</button>
  </section>

  <section id="calendar" class="hidden">

    <div class="calendar-header">
      <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
      <h3 id="calendarMonthLabel"></h3>
      <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>

    <div class="calendar-grid" style="margin-bottom:5px;">
      <div class="day-name">Min</div>
      <div class="day-name">Sen</div>
      <div class="day-name">Sel</div>
      <div class="day-name">Rab</div>
      <div class="day-name">Kam</div>
      <div class="day-name">Jum</div>
      <div class="day-name">Sab</div>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>

    <div class="calendar-footer">
      <button class="btn-close-calendar" onclick="hideCalendarView()">Tutup Kalender</button>
    </div>

  </section>

</main>

<footer class="app-footer">
  <p>&copy; 2026 <strong id="footerSchoolName">Sekolah</strong></p>
  <p><a href="#" id="footerSchoolLink" class="footer-link" target="_blank"></a></p>
</footer>

<script src="config.js"></script>
<script>
  let currentFontSize = 100;
  let activeNavDate = new Date();

  // 1. Pengatur Zoom Font Artikel
  function changeFontSize(step) {
    currentFontSize += step * 10;
    if (currentFontSize < 80) currentFontSize = 80;
    if (currentFontSize > 160) currentFontSize = 160;
    
    const target = document.getElementById('articleContent');
    if (target) {
      target.style.fontSize = currentFontSize + '%';
    }
  }

  // 2. Navigasi Harian (Kemarin / Besok)
  function navigateDay(offset) {
    // Ambil tanggal ISO yang tersimpan pada elemen displayDate jika ada
    const displayElem = document.getElementById('displayDate');
    if (displayElem && displayElem.dataset.isoDate) {
      activeNavDate = new Date(displayElem.dataset.isoDate + 'T00:00:00');
    }

    // Geser tanggal sesuai offset (-1 atau +1)
    activeNavDate.setDate(activeNavDate.getDate() + offset);
    
    const yyyy = activeNavDate.getFullYear();
    const mm = String(activeNavDate.getMonth() + 1).padStart(2, '0');
    const dd = String(activeNavDate.getDate()).padStart(2, '0');
    const targetDateStr = `${yyyy}-${mm}-${dd}`;

    // Cek pemanggilan fungsi dari renungan-engine
    if (typeof window.selectDate === 'function') {
      window.selectDate(targetDateStr);
    } else if (typeof window.loadRenungan === 'function') {
      window.loadRenungan(targetDateStr);
    } else if (typeof window.loadRenunganByDate === 'function') {
      window.loadRenunganByDate(targetDateStr);
    } else if (typeof window.fetchRenungan === 'function') {
      window.fetchRenungan(targetDateStr);
    } else if (typeof CONFIG !== 'undefined' && CONFIG.API_URL) {
      // Fallback langsung panggil API Google Apps Script
      fetchRenunganDirect(targetDateStr);
    }
  }

  // Pemuat data cadangan jika engine CDN tidak langsung merespons
  function fetchRenunganDirect(dateStr) {
    const loader = document.getElementById('loader');
    const renunganSec = document.getElementById('renungan');
    const emptySec = document.getElementById('emptyState');

    if (loader) loader.classList.remove('hidden');
    if (renunganSec) renunganSec.classList.add('hidden');
    if (emptySec) emptySec.classList.add('hidden');

    fetch(`${CONFIG.API_URL}?date=${dateStr}`)
      .then(res => res.json())
      .then(resData => {
        if (loader) loader.classList.add('hidden');

        if (resData.status === 'success' && resData.data) {
          if (renunganSec) renunganSec.classList.remove('hidden');
          
          document.getElementById('displayJudul').innerText = resData.data.judul || '';
          document.getElementById('displayAyat').innerText = resData.data.ayatRef || '';
          document.getElementById('displayAyatText').innerText = resData.data.ayatText || '';
          document.getElementById('displayIsi').innerHTML = resData.data.isi || '';
          document.getElementById('displayRefleksi').innerText = resData.data.refleksi || '';
          document.getElementById('count').innerText = resData.data.views || 0;

          const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
          const dateObj = new Date(dateStr + 'T00:00:00');
          const displayElem = document.getElementById('displayDate');
          if (displayElem) {
            displayElem.innerText = dateObj.toLocaleDateString('id-ID', dateOptions);
            displayElem.dataset.isoDate = dateStr; // Simpan penanda tanggal aktif
          }
        } else {
          if (emptySec) emptySec.classList.remove('hidden');
        }
      })
      .catch(err => {
        console.error("Gagal memuat renungan:", err);
        if (loader) loader.classList.add('hidden');
        if (emptySec) emptySec.classList.remove('hidden');
      });
  }

  // 3. Fitur Bagikan ke WhatsApp
  function shareToWhatsApp() {
    const judul = document.getElementById('displayJudul')?.innerText || '';
    const ayat = document.getElementById('displayAyat')?.innerText || '';
    const url = window.location.href;
    const text = `*${judul}*\n_${ayat}_\n\nMari baca renungan hari ini melalui tautan berikut:\n${url}`;
    
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
  }
</script>

<!-- CDN Engine Utama -->
<script src="https://cdn.jsdelivr.net/gh/abdiflash/renungan-engine@main/engine/app.js"></script>

</body>
</html>
