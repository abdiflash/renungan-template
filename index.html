<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renungan Harian Premium</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=3">

  <!-- MIDTRANS SNAP SCRIPT (Diambil dari index kiosk 33) -->
  <script src="https://app.midtrans.com/snap/snap.js" data-client-key="Mid-client-MK-5yLAVCdP0Yd_o"></script>

  <style>
    :root {
      --primary-color: #1b3058;
      --accent-color: #2563eb;
      --success-color: #059669;
    }

    .app-header {
      background-color: var(--primary-color) !important;
      padding: 16px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .license-status-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .license-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }

    .license-badge.free { 
      background: rgba(245, 158, 11, 0.2); 
      color: #f59e0b; 
      border: 1px solid rgba(245, 158, 11, 0.4); 
    }

    .license-badge.active { 
      background: rgba(16, 185, 129, 0.2); 
      color: #10b981; 
      border: 1px solid rgba(16, 185, 129, 0.4); 
    }

    .btn-buy-pass {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-buy-pass:hover {
      background: #1d4ed8;
    }

    /* Modal Style dari Kiosk 33 */
    .modal {
      position: fixed; 
      inset: 0;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100; 
      display: none;
      justify-content: center; 
      align-items: center;
      padding: 16px;
    }

    .modal.active { 
      display: flex; 
    }

    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .btn-plan {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent-color);
      color: #ffffff;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 450px;
      margin: 20px auto;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .cal-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--primary-color);
      font-weight: 700;
    }

    .btn-cal-nav {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--primary-color);
      background: transparent;
      color: var(--primary-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .btn-cal-nav:hover {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .cal-grid-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #888888;
      margin-bottom: 12px;
    }

    .cal-grid-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- HEADER DENGAN INDIKATOR LISENSI & TOMBOL PEMBAYARAN -->
  <header class="app-header">
    <h1 style="font-size: 1.1rem; margin: 0;">📖 Renungan Harian</h1>
    
    <div class="license-status-wrapper">
      <span id="licenseBadge" class="license-badge free">🟠 Free Mode</span>
      <button id="midtransPayBtn" class="btn-buy-pass">💳 Langganan Premium</button>
    </div>
  </header>

  <!-- KONTEN UTAMA APLIKASI -->
  <main>
    <div class="calendar-card">
      <div class="cal-header">
        <h2>Kalender Renungan</h2>
        <div style="display: flex; gap: 8px;">
          <button class="btn-cal-nav">&lt;</button>
          <button class="btn-cal-nav">&gt;</button>
        </div>
      </div>
      <div class="cal-grid-header">
        <div>MIN</div><div>SEN</div><div>SEL</div><div>RAB</div><div>KAM</div><div>JUM</div><div>SAB</div>
      </div>
      <div class="cal-grid-days">
        <!-- Item Kalender Renungan -->
      </div>
    </div>
  </main>

  <!-- MODAL PILIHAN PAKET PEMBAYARAN MIDTRANS -->
  <div class="modal" id="paymentModal">
    <div class="modal-card">
      <h3 style="margin-bottom: 8px; color: var(--primary-color);">🛒 Pilih Paket Renungan Premium</h3>
      <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">
        Akses seluruh konten renungan harian & materi eksklusif tanpa batas.
      </p>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button id="pay10kBtn" class="btn-plan">
          <span>⚡ Akses 24 Jam</span>
          <strong>Rp 10.000</strong>
        </button>
        <button id="pay50kBtn" class="btn-plan" style="background: #4f46e5;">
          <span>🌟 Langganan 1 Bulan (30 Hari)</span>
          <strong>Rp 50.000</strong>
        </button>
      </div>

      <button id="closePaymentBtn" style="width: 100%; background: #94a3b8; border: none; color: white; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 12px;">Batal</button>
    </div>
  </div>

  <!-- SCRIPT ALGORITMA MIDTRANS SNAP (Diadaptasi dari Index Kiosk 33) -->
  <script>
    // System Config
    const SYSTEM_SECRET_KEY = "RENUNGAN_PRO_SECRET_2026";

    // DOM Elements
    const licenseBadge = document.getElementById('licenseBadge');
    const midtransPayBtn = document.getElementById('midtransPayBtn');
    const paymentModal = document.getElementById('paymentModal');
    const closePaymentBtn = document.getElementById('closePaymentBtn');
    const pay10kBtn = document.getElementById('pay10kBtn');
    const pay50kBtn = document.getElementById('pay50kBtn');

    // 1. Pengecekan Status Lisensi Aktif
    function isPassActive() {
      const expiryStr = localStorage.getItem('cfg_expiry_date');
      if (!expiryStr) return false;
      const expTime = new Date(expiryStr).getTime();
      if (isNaN(expTime)) return false;
      return new Date().getTime() < expTime;
    }

    // 2. Update Indikator Lisensi di UI Header
    function updateLicenseStatusUI() {
      if (isPassActive()) {
        const expiryDate = new Date(localStorage.getItem('cfg_expiry_date'));
        const diffMs = expiryDate - new Date();
        const minsLeft = Math.max(0, Math.ceil(diffMs / (1000 * 60)));
        
        if (minsLeft <= 60) {
          licenseBadge.className = 'license-badge active';
          licenseBadge.innerHTML = `🟢 Premium (${minsLeft}m Left)`;
        } else {
          const hoursLeft = Math.floor(minsLeft / 60);
          if (hoursLeft >= 48) {
            const daysLeft = Math.floor(hoursLeft / 24);
            licenseBadge.className = 'license-badge active';
            licenseBadge.innerHTML = `🟢 Premium (${daysLeft}d Left)`;
          } else {
            licenseBadge.className = 'license-badge active';
            licenseBadge.innerHTML = `🟢 Premium (${hoursLeft}h Left)`;
          }
        }
      } else {
        licenseBadge.className = 'license-badge free';
        licenseBadge.innerHTML = `🟠 Free Mode`;
      }
    }

    // 3. Menambahkan Durasi Aktif Lisensi Setelah Pembayaran Sukses
    function addPassMinutes(minsToAdd) {
      const expiryStr = localStorage.getItem('cfg_expiry_date');
      const currentExpiry = (expiryStr && !isNaN(new Date(expiryStr).getTime())) ? new Date(expiryStr).getTime() : 0;
      const now = Date.now();

      const baseTime = (currentExpiry > now) ? currentExpiry : now;
      const newExpiry = new Date(baseTime + (minsToAdd * 60 * 1000)).toISOString();

      localStorage.setItem('cfg_expiry_date', newExpiry);
      updateLicenseStatusUI();
    }

    function addPassHours(hoursToAdd) {
      addPassMinutes(hoursToAdd * 60);
    }

    function activatePassByAmount(paidAmount = 10000) {
      let hoursToAdd = 24;

      if (paidAmount >= 50000) {
        hoursToAdd = 30 * 24; // 30 Hari
      } else if (paidAmount >= 10000) {
        hoursToAdd = 24; // 24 Jam
      } else {
        hoursToAdd = Math.max(1, Math.floor((paidAmount / 10000) * 24));
      }

      addPassHours(hoursToAdd);

      if (paymentModal.classList.contains('active')) paymentModal.classList.remove('active');

      const labelText = hoursToAdd >= 720 ? `${hoursToAdd / 24} Hari` : `${hoursToAdd} Jam`;
      alert(`🎉 Pembayaran Berhasil! Akses Renungan Premium Aktif: +${labelText}.`);
    }

    // 4. Algoritma Utama Panggilan Midtrans Snap API
    async function triggerMidtransPayment(planAmount = 10000, targetBtn = null) {
      const activeBtn = targetBtn || midtransPayBtn;
      const originalText = activeBtn ? activeBtn.innerHTML : '';

      try {
        if (activeBtn) {
          activeBtn.innerText = 'Memproses...';
          activeBtn.disabled = true;
        }

        // Endpoint pembuat Snap Token dari server Midtrans
        const response = await fetch('https://edueasy.id/wp-json/photobooth/v1/create-snap-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: planAmount })
        });

        if (!response.ok) throw new Error(`Server status ${response.status}`);
        const data = await response.json();

        if (!data || !data.token) {
          alert("Gagal mendapatkan token transaksi Midtrans.");
          return;
        }

        // Panggilan Window Snap Pop-up
        if (typeof snap !== 'undefined' && snap.pay) {
          window.snap.pay(data.token, {
            onSuccess: function(result) {
              const grossAmount = parseInt(result.gross_amount) || planAmount;
              activatePassByAmount(grossAmount);
            },
            onPending: function() { 
              alert("Menunggu pembayaran diselesaikan..."); 
            },
            onError: function() { 
              alert("Transaksi pembayaran gagal/dibatalkan."); 
            }
          });
        } else {
          alert("Library Midtrans Snap belum siap.");
        }

      } catch (err) {
        console.error("Midtrans Error:", err);
        alert("Gagal terhubung ke server pembayaran.");
      } finally {
        if (activeBtn) {
          activeBtn.innerHTML = originalText;
          activeBtn.disabled = false;
        }
      }
    }

    // Event Listeners
    if (midtransPayBtn) midtransPayBtn.addEventListener('click', () => paymentModal.classList.add('active'));
    if (closePaymentBtn) closePaymentBtn.addEventListener('click', () => paymentModal.classList.remove('active'));

    if (pay10kBtn) {
      pay10kBtn.addEventListener('click', () => {
        paymentModal.classList.remove('active');
        triggerMidtransPayment(10000, pay10kBtn);
      });
    }

    if (pay50kBtn) {
      pay50kBtn.addEventListener('click', () => {
        paymentModal.classList.remove('active');
        triggerMidtransPayment(50000, pay50kBtn);
      });
    }

    // Init pada saat load halaman
    window.addEventListener('load', () => {
      updateLicenseStatusUI();
    });
  </script>
</body>
</html>
